name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://qbo:qbo@localhost:5432/ledgerly_test

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qbo
          POSTGRES_PASSWORD: qbo
          POSTGRES_DB: ledgerly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qbo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated code is in sync with the OpenAPI spec
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git diff --exit-code lib/api-client-react/src/generated lib/api-zod/src/generated

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Create test database schema
        run: pnpm --filter @workspace/db run push --force

      - name: Test
        run: pnpm --filter @workspace/api-server test

      - name: Build
        run: pnpm -r --if-present run build
